name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/**"

permissions: {}

jobs:
  version:
    name: Calculate version
    uses: ./.github/workflows/_version.yml
    permissions:
      contents: read
    with:
      is-release: true

  tag:
    name: Create release tag
    needs: version
    uses: ./.github/workflows/_create-release-tag.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}

  test:
    name: Run test
    uses: ./.github/workflows/_test.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write
    with:
      project-name: Billing.Test
      project-path: ./test/Billing.Test

  build:
    name: Run build
    needs:
      - test
      - version
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      project-name: Billing
      project-path: ./src/Billing
      version: ${{ needs.version.outputs.version }}

  build-push-docker:
    name: Build and push Docker image
    needs:
      - test
      - version
      - build
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      project-name: Billing
      project-path: ./src/Billing
      version: ${{ needs.version.outputs.version }}
      image-name: billing-relay
      push-docker-image: true
    secrets: inherit

  deploy:
    name: Trigger deployment via deploy repo
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    needs:
      - tag
      - build-push-docker

    steps:
      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: "BW-GHAPP-ID,BW-GHAPP-KEY"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Generate GH App token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-ID }}
          private-key: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deploy
          permission-deployments: write

      - name: Create QA deployment in deploy repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          _TAG: ${{ needs.tag.outputs.git-tag }}
        run: |
          gh api repos/bitwarden/deploy/deployments \
            --method POST \
            -f ref=main \
            -f environment=trigger-actions \
            -f task=deploy-billing-relay-qa \
            -f description="Deploy billing-relay $_TAG to QA" \
            -F payload="{\"tag\":\"$_TAG\"}"

      - name: Create PRD deployment in deploy repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          _TAG: ${{ needs.tag.outputs.git-tag }}
        run: |
          gh api repos/bitwarden/deploy/deployments \
            --method POST \
            -f ref=main \
            -f environment=trigger-actions \
            -f task=deploy-billing-relay-prd \
            -f description="Deploy billing-relay $_TAG to PRD" \
            -F payload="{\"tag\":\"$_TAG\"}"
