name: _docker
run-name: "Build ${{ inputs.project-name }} docker image and push ${{ inputs.push-docker-image }} to ACR"

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        required: true
      project-path:
        type: string
        required: true
      version:
        type: string
        required: false
      push-docker-image:
        type: boolean
        required: false
        default: false
      image-name:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-22.04
    env:
      _PROJECT_PATH: ${{ inputs.project-path }}
      _PROJECT_NAME: ${{ inputs.project-name }}
      _VERSION: ${{ inputs.version }}
      _PUSH_DOCKER_IMAGE: ${{ inputs.push-docker-image }}
      _IMAGE_NAME: ${{ inputs.image-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to Azure
        if: ${{ inputs.push-docker-image }}
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Log in to ACR
        if: ${{ inputs.push-docker-image }}
        run: az acr login -n "bitwardenprod"

      - name: Generate Docker image tag
        id: tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            IMAGE_TAG=$(echo "${GITHUB_HEAD_REF}" | sed "s#/#-#g")
          else
            IMAGE_TAG="$_VERSION"
          fi
          # limit image tags to 128 characters
          IMAGE_TAG=${IMAGE_TAG:0:128}
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate tag list
        id: tag-list
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: echo "tags=bitwardenprod.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ env._PROJECT_NAME }}.zip"

      - name: Set up build artifact
        run: |
          mkdir -p "$_PROJECT_PATH/obj/build-output/publish"
          unzip "$_PROJECT_NAME.zip" \
            -d "$_PROJECT_PATH/obj/build-output/publish"

      - name: Build Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ env._PROJECT_PATH }} # zizmor: ignore[template-injection] # Needed to use this action, no risk with current usage
          file: ${{ env._PROJECT_PATH }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env._PUSH_DOCKER_IMAGE }}
          tags: ${{ steps.tag-list.outputs.tags }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"

      - name: Log out from Azure
        if: ${{ inputs.push-docker-image }}
        uses: bitwarden/gh-actions/azure-logout@main
